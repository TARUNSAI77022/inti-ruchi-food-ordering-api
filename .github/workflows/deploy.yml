name: Build and Push to Amazon ECR

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}                   # Securely injected AWS Region
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}           # Securely injected ECR repository name

jobs:
  build-and-push:
    name: Build, Tag, and Push Config
    runs-on: ubuntu-latest
    environment: production

    steps:
    # 1. Checkout the source code from the main branch
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Authenticate cleanly with AWS using Secrets
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # 3. Log the GitHub Actions runner into Amazon ECR natively
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      
    # 4. Build, Tag, and Push the Docker images to your ECR Repository
    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}  # GitHub's unique commit SHA identifier
      working-directory: .
      run: |
        # Build the docker container natively inside the runner
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        
        # Identify the exact same image securely with the generic "latest" tag
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        
        # Push the versioned snapshot to Amazon ECR
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        
        # Push the generic reference over to Amazon ECR
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
